# Allow network traffic for the lws-operator pod:
# - Ingress: metrics scrape from platform monitoring on port 8443
# - Egress: all (for DNS, API server, and other outbound traffic)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lws-allow-operator
  namespace: openshift-lws-operator
spec:
  podSelector:
    matchLabels:
      name: openshift-lws-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow metrics from pods in same namespace (E2E tests)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8443
    # Allow metrics from OpenShift monitoring namespaces
    - from:
        - namespaceSelector:
            matchLabels:
              openshift.io/cluster-monitoring: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8443
  egress:
    # Allow all egress for DNS, API server, etc.
    # API address and port are not known at manifest time.
    - {}
