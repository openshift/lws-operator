# Default deny for all pods in the namespace. Applied last so allow
# policies exist before isolation takes effect. policyTypes with no allow rules
# makes the implicit deny explicit. Allow policies are additive on top.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lws-default-deny
  namespace: openshift-lws-operator
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
