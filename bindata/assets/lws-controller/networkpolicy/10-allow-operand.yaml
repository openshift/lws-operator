# Allow network traffic for the lws-controller-manager operand pods:
# - Ingress: admission webhook (9443) and metrics scrape (8443)
# - Egress: all (for DNS, API server, and other outbound traffic)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lws-allow-operand
  namespace: openshift-lws-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lws
      control-plane: controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow admission webhook traffic from kube-apiserver
    # Do not restrict ingress sources: kube-apiserver often runs with hostNetwork
    # and does not match namespace/pod selectors. TLS protects the webhook endpoint.
    # Service lws-webhook-service exposes port 443 -> targetPort 9443.
    # NetworkPolicy uses the pod/server port number (OVN-Kubernetes does not support port names).
    - ports:
        - protocol: TCP
          port: 9443
    # Allow metrics from pods in same namespace (E2E tests, operator health checks)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8443
    # Allow metrics from OpenShift monitoring namespaces
    - from:
        - namespaceSelector:
            matchLabels:
              openshift.io/cluster-monitoring: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8443
  egress:
    # Allow all egress for DNS, API server, etc.
    # API address and port are not known at manifest time.
    - {}
