# Allow admission webhook traffic to the operand.
# Do not restrict ingress sources: kube-apiserver often runs with hostNetwork and
# does not match namespace/pod selectors (see openshift-kueue-operator pattern for
# non-OpenShift). TLS still protects the webhook endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lws-allow-ingress-webhook
  namespace: openshift-lws-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lws
      control-plane: controller-manager
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: webhook-server
