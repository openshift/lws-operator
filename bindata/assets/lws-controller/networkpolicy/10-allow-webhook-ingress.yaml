# Allow admission webhook traffic to the operand on container port 9443.
# Service lws-webhook-service exposes port 443 -> targetPort 9443; NetworkPolicy
# must use the pod/server port number (OVN-Kubernetes does not support port names).
# Do not restrict ingress sources: kube-apiserver often runs with hostNetwork and
# does not match namespace/pod selectors. TLS still protects the webhook endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lws-allow-webhook-ingress
  namespace: openshift-lws-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lws
      control-plane: controller-manager
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 9443
