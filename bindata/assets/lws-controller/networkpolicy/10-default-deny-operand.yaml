# Default deny all ingress and egress for the lws-controller-manager operand pods.
# The allow policy (10-allow-operand.yaml) creates exceptions for webhook, metrics, and egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lws-default-deny-operand
  namespace: openshift-lws-operator
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lws
      control-plane: controller-manager
  policyTypes:
    - Ingress
    - Egress
